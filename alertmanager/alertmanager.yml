global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 5m
  receiver: 'agent-webhook'

receivers:
  - name: 'agent-webhook'
    webhook_configs:
      - url: 'http://localhost:9093'
        send_resolved: true
        http_config:
          follow_redirects: true
        max_alerts: 10

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['service']