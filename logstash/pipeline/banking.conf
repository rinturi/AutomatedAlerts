input {
  beats {
    port => 5044
  }
  # Also accept direct HTTP log submissions from services
  http {
    port => 5000
    codec => json
  }
}

filter {
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "parsed"
    }
    mutate {
      add_field => {
        "[@timestamp]"  => "%{[parsed][@timestamp]}"
        "[service]"     => "%{[parsed][service]}"
        "[level]"       => "%{[parsed][level]}"
        "[log_message]" => "%{[parsed][message]}"
      }
    }
  }

  date {
    match => ["[@timestamp]", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "banking-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }
  stdout {
    codec => rubydebug
  }
}