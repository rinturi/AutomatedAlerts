server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: banking-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values:
              - payment-svc
              - auth-svc
              - loan-svc
              - notification-svc
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: service
        regex: /(.*)
        replacement: $1
      - source_labels: [__meta_docker_container_name]
        target_label: container
    pipeline_stages:
      - json:
          expressions:
            level: level
            exception_type: exception_type
            message: message
      - labels:
          level:
          exception_type:
